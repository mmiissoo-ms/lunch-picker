<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#222}
.wrap{max-width:520px;margin:auto;padding:22px 16px 40px}.head{text-align:center;margin:8px 0 22px}
h1{font-size:30px;margin:0 0 6px}.sub{color:#777;font-size:14px}
.tabs{display:flex;background:#e9e9e6;border-radius:14px;padding:4px;margin-bottom:16px}
.tab{flex:1;border:0;background:transparent;padding:11px;border-radius:11px;font-size:16px}.tab.active{background:#fff;box-shadow:0 1px 5px #0001}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-weight:700}
input[type=range]{width:100%;margin:15px 0 4px}
button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer}
.primary{background:#222;color:#fff;width:100%;font-weight:700}.light{background:#f0f0ed}.danger{background:#fff0f0;color:#c33}
.actions{display:flex;gap:8px}.actions button{flex:1}
.results{display:grid;gap:8px;margin-top:12px}.shop{border:1px solid #eee;border-radius:13px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.shop small,.pool small{color:#888}.shop button{padding:7px 10px}
.pool-item{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}
.pool-item:first-child{border-top:0}.empty{text-align:center;color:#999;padding:15px 0}
.winner{text-align:center;padding:18px 8px}.winner .emoji{font-size:42px}.winner .name{font-size:25px;font-weight:800;margin:7px 0}.winner .walk{color:#777}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:end;justify-content:center}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px 28px}.sheet input,.sheet select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin:7px 0 12px;font-size:16px}
.loc{font-size:13px;color:#777;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>今天吃什麼？</h1><div class="sub">不用想，讓它幫你決定。</div></div>

  <div class="tabs">
    <button class="tab active" data-type="restaurant">🍜 餐廳</button>
    <button class="tab" data-type="drink">🥤 飲品</button>
  </div>

  <div class="card">
    <div class="row"><span class="label">🚶 最多步行</span><b><span id="mins">8</span> 分鐘</b></div>
    <input id="range" type="range" min="1" max="20" value="8">
    <div class="actions">
      <button class="light" id="locBtn">📍 取得位置</button>
      <button class="light" id="searchBtn">🗺️ 找附近店家</button>
    </div>
    <div class="loc" id="location">尚未取得位置</div>
    <div class="results" id="results"></div>
  </div>

  <div class="card">
    <div class="row"><span class="label">🎲 我的卡池</span><span id="count">0 家</span></div>
    <div id="pool"></div>
    <button class="primary" id="drawBtn">🎲 抽一個</button>
    <button class="light" id="manualBtn" style="width:100%;margin-top:8px">＋ 手動加入店家</button>
  </div>

  <div class="card" id="winnerCard" style="display:none">
    <div class="winner">
      <div class="emoji">🎉</div>
      <div class="name" id="winnerName"></div>
      <div class="walk" id="winnerWalk"></div>
      <button class="light" id="againBtn" style="margin-top:12px">🔄 再抽一次</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 style="margin-top:0">加入店家</h2>
    <input id="newName" placeholder="店家名稱">
    <select id="newType"><option value="restaurant">🍜 餐廳</option><option value="drink">🥤 飲品</option></select>
    <input id="newWalk" type="number" min="1" max="60" value="5" placeholder="步行分鐘">
    <div class="actions"><button class="light" id="cancel">取消</button><button class="primary" id="add">加入</button></div>
  </div>
</div>

<script>
const demo = {restaurant:[],drink:[]};

const categories = {
 restaurant: '["amenity"~"restaurant|fast_food|food_court|cafe"]',
 drink: '["amenity"~"cafe|bar|juice_bar"]'
};

let userLat = null, userLon = null;
let currentResults = [];

async function searchNearby() {
  const resultsEl = $("results");
  if (userLat === null) {
    resultsEl.innerHTML = '<div class="empty">請先按「📍 取得位置」</div>';
    return;
  }

  const maxWalk = +$("range").value;
  // Approximate walking radius: 80 metres/minute.
  const radius = Math.max(250, maxWalk * 80);
  resultsEl.innerHTML = '<div class="empty">🗺️ 正在找附近店家…</div>';

  const q = `[out:json][timeout:15];
(
  nwr(around:${radius},${userLat},${userLon})${categories[type]};
);
out center tags;`;

  try {
    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:q
    });
    if (!res.ok) throw new Error("Overpass error");
    const data = await res.json();

    const seen = new Set();
    currentResults = data.elements.map(el => {
      const lat = el.lat ?? el.center?.lat;
      const lon = el.lon ?? el.center?.lon;
      const tags = el.tags || {};
      const name = tags.name || tags["name:zh"] || tags["name:en"];
      if (!name || lat == null || lon == null) return null;
      const key = name + "|" + lat.toFixed(5) + "|" + lon.toFixed(5);
      if (seen.has(key)) return null;
      seen.add(key);
      const dist = distanceMeters(userLat,userLon,lat,lon);
      return {
        name, lat, lon, dist,
        walk: Math.max(1, Math.ceil(dist / 80)),
        emoji: type === "drink" ? "🥤" : "🍜",
        type
      };
    }).filter(Boolean)
      .sort((a,b)=>a.dist-b.dist)
      .filter(x=>x.walk <= maxWalk)
      .slice(0,30);

    if (!currentResults.length) {
      resultsEl.innerHTML = '<div class="empty">這個步行範圍沒有找到有名稱的店家。<br>可以把步行時間調大再搜尋。</div>';
      return;
    }

    resultsEl.innerHTML = currentResults.map((x,i)=>`
      <div class="shop">
        <div>${x.emoji} <b>${escapeHtml(x.name)}</b><br>
        <small>🚶 約 ${x.walk} 分鐘 · ${Math.round(x.dist)} 公尺</small></div>
        <button class="light" onclick="addRealShop(${i})">＋ 加入</button>
      </div>`).join("");
  } catch(e) {
    resultsEl.innerHTML = '<div class="empty">搜尋失敗，請稍後再試。<br>公開地圖服務偶爾會暫時繁忙。</div>';
  }
}

function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000, rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function addRealShop(i){
  const x=currentResults[i];
  if(pool.some(p=>p.name===x.name && p.type===x.type))
    return alert("已經在卡池裡了");
  pool.push({
    id:Date.now()+Math.random(),
    name:x.name, emoji:x.emoji, walk:x.walk, type:x.type,
    lat:x.lat, lon:x.lon
  });
  save();
}

let type="restaurant";
let pool=JSON.parse(localStorage.getItem("lunchPool")||"[]");

const $=id=>document.getElementById(id);
function save(){localStorage.setItem("lunchPool",JSON.stringify(pool));renderPool()}
function renderPool(){
 const items=pool.filter(x=>x.type===type); $("count").textContent=items.length+" 家";
 $("pool").innerHTML=items.length?items.map(x=>`
 <div class="pool-item"><div>${x.emoji||"🏪"} <b>${escapeHtml(x.name)}</b><br><small>🚶 ${x.walk} 分鐘</small></div>
 <button class="danger" onclick="removeShop('${x.id}')">刪除</button></div>`).join(""):'<div class="empty">還沒有店家，先去找附近店家吧</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showResults(){ searchNearby(); }
function addShop(name,emoji,walk,t){
 if(pool.some(x=>x.name===name&&x.type===t))return alert("已經在卡池裡了");
 pool.push({id:Date.now()+Math.random(),name,emoji,walk,type:t});save();
}
function removeShop(id){pool=pool.filter(x=>String(x.id)!==String(id));save()}
function draw(){
 const items=pool.filter(x=>x.type===type);
 if(!items.length)return alert("卡池還沒有店家，先加入幾家吧！");
 const x=items[Math.floor(Math.random()*items.length)];
 $("winnerName").textContent=x.emoji+" "+x.name;
 $("winnerWalk").textContent="🚶 約 "+x.walk+" 分鐘";
 $("winnerCard").style.display="block";
 $("winnerCard").scrollIntoView({behavior:"smooth",block:"center"});
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 type=b.dataset.type;renderPool();$("results").innerHTML='<div class="empty">先按「📍 取得位置」，再搜尋附近店家</div>';
});
$("range").oninput=e=>{$("mins").textContent=e.target.value};
$("searchBtn").onclick=searchNearby;
$("drawBtn").onclick=draw;$("againBtn").onclick=draw;

$("locBtn").onclick=()=>{
 if(!navigator.geolocation){
   $("location").textContent="瀏覽器不支援定位"; return;
 }
 $("location").textContent="正在取得位置…";
 navigator.geolocation.getCurrentPosition(
  p=>{
    userLat=p.coords.latitude; userLon=p.coords.longitude;
    $("location").textContent=`已取得目前位置 · ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
    searchNearby();
  },
  err=>{
    $("location").textContent="無法取得位置，請允許瀏覽器使用定位";
  },
  {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
);

$("manualBtn").onclick=()=>$("modal").classList.add("show");
$("cancel").onclick=()=>$("modal").classList.remove("show");
$("add").onclick=()=>{
 const n=$("newName").value.trim(),t=$("newType").value,w=+$("newWalk").value;
 if(!n)return alert("請輸入店家名稱");
 addShop(n,"🏪",w,t);$("modal").classList.remove("show");$("newName").value="";
};
renderPool();$("results").innerHTML='<div class="empty">先按「📍 取得位置」，再搜尋附近店家</div>';
</script>
</body>
</html>
